[project]
name = "pago-facil-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "standardwebhooks>=1.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest>=9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-playwright==0.10.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pytest-asyncio 1.4.1 avisa si no se fija. "function" es el alcance al que va a pasar.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B904"]

# Versión mayor publicada hace más de dos semanas (T009).
# actions/checkout@v7 es v7.0.1 (2026-07-20).
# astral-sh/setup-uv solo tiene tag mayor hasta @v7 (v7.6.0, 2026-03-16):
# v8, v9 y v10 se publican como versión completa, sin @vN.
name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium webkit
      - run: uv run ruff check --config pyproject.toml ../web
      - run: uv run ruff format --config pyproject.toml --check ../web
      - run: uv run pytest ../web -q

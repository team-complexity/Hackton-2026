<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05070d">
    <meta name="description" content="PAGO FÁCIL: cobra con QR CoDi, sin comisiones y con aviso inmediato.">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://localhost:8000 https:; manifest-src 'self';"
    >
    <title>PAGO FÁCIL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icono.svg" type="image/svg+xml">
    <link rel="stylesheet" href="estilos.css">
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <div id="app" class="app">
      <header class="barra" data-prueba="barra">
        <a class="logo" href="#" data-prueba="logo-inicio" aria-label="PAGO FÁCIL inicio">
          <span class="logo-mark" aria-hidden="true">P</span>
          <span class="logo-texto" data-prueba="marca">PAGO<span>FÁCIL</span></span>
        </a>
        <button class="menu-toggle" data-prueba="menu-toggle" aria-label="Abrir menú" hidden>
          <span></span><span></span><span></span>
        </button>
        <div class="barra-derecha" data-prueba="barra-derecha">
          <nav class="navegacion" data-prueba="navegacion" hidden aria-label="Secciones"></nav>
          <div class="barra-acciones" data-prueba="barra-acciones"></div>
        </div>
      </header>
      <main class="contenido">
        <div id="vistas" class="vistas"></div>
      </main>
    </div>
    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
